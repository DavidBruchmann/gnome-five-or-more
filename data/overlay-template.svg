      <circle cx="0" cy="0" r="37.5" fill="none" stroke="#000000" stroke-width="2" filter="url(#pulsingGlow)"/>
      <circle cx="0" cy="0" r="37.5" fill="url(#ballHighlight)"/>
      <ellipse cx="-5" cy="-10" rx="15" ry="8" fill="url(#reflection)" opacity="0.8"/>
    </g>
  </g>
  
