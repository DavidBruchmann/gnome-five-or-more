      <ellipse cx="-5" cy="-10" rx="13" ry="7" fill="url(#reflection)" opacity="0.6"/>
    </g>
    
    <g id="type-1-growing" transform="translate(250,150)">
      <circle cx="0" cy="0" r="41.25" fill="url(#ballShadow)" filter="url(#dropShadow)"/>
      <circle cx="0" cy="0" r="41.25" fill="none" stroke="#000000" stroke-width="2.2" filter="url(#growingGlow)"/>
      <circle cx="0" cy="0" r="41.25" fill="url(#ballHighlight)"/>
      <ellipse cx="-5" cy="-10" rx="17" ry="9" fill="url(#reflection)" opacity="0.6"/>
    </g>
    
    <g id="type-1-pulsing" transform="translate(350,150)">
      <circle cx="0" cy="0" r="37.5" fill="url(#ballShadow)" filter="url(#dropShadow)"/>
      <circle cx="0" cy="0" r="37.5" fill="none" stroke="#000000" stroke-width="2" filter="url(#pulsingGlow)"/>
      <circle cx="0" cy="0" r="37.5" fill="url(#ballHighlight)"/>
      <ellipse cx="-5" cy="-10" rx="15" ry="8" fill="url(#reflection)" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Row 2: Type 2 pieces -->
  <g id="type-2-overlays">
    <g id="type-2-normal" transform="translate(50,250)">
      <circle cx="0" cy="0" r="37.5" fill="url(#ballShadow)" filter="url(#dropShadow)"/>
