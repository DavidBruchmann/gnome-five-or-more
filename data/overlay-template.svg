  <g id="type-4-overlays">
    <g id="type-4-normal" transform="translate(50,450)">
      <circle cx="0" cy="0" r="37.5" fill="url(#ballShadow)" filter="url(#dropShadow)"/>
      <circle cx="0" cy="0" r="37.5" fill="none" stroke="#000000" stroke-width="2" filter="url(#normalGlow)"/>
      <circle cx="0" cy="0" r="37.5" fill="url(#ballHighlight)"/>
      <ellipse cx="-5" cy="-10" rx="15" ry="8" fill="url(#reflection)" opacity="0.6"/>
    </g>
    
    <g id="type-4-shrinking" transform="translate(150,450)">
      <circle cx="0" cy="0" r="33.75" fill="url(#ballShadow)" filter="url(#dropShadow)"/>
      <circle cx="0" cy="0" r="33.75" fill="none" stroke="#000000" stroke-width="1.8" filter="url(#shrinkingGlow)"/>
      <circle cx="0" cy="0" r="33.75" fill="url(#ballHighlight)"/>
